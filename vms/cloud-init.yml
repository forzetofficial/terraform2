#cloud-config
users:
  - name: ubuntu
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${public_key}
    lock_passwd: true

package_update: true
package_upgrade: false

packages:
  - nginx
  - vim
  - curl
  - htop
  - git
  - net-tools

runcmd:
  - systemctl enable nginx
  - systemctl start nginx
  - [systemctl, status, nginx]
  - [curl, localhost]

final_message: "VM is up after $UPTIME seconds"